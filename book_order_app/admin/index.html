<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Order Admin</title><link rel="stylesheet" href="../shared/styles.css"></head><body><main class="shell"><header class="hero"><h1>🗂️ Book Order Admin</h1><p>အော်ဒါများကို စီမံခန့်ခွဲရန်</p></header><nav class="toolbar"><button class="pill active" id="historyTab">Order History</button><button class="pill" id="createTab">Create Order</button><button class="pill" id="refresh">↻ Refresh</button></nav><section id="loginPanel" class="panel"><h2>Admin Login</h2><p class="muted">အော်ဒါစာရင်းကို ကြည့်ရန် Admin password ထည့်ပါ။</p><div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Admin password"></div><button id="loginButton" class="primary">Login</button><div id="loginStatus" class="status" role="status"></div></section><section id="adminContent" hidden><section id="history"><div class="section-title"><h2>Order History</h2><span class="muted" id="orderCount">ဖတ်ရှုနေသည်…</span></div><div id="orders"></div></section><section id="create" hidden><div class="notice">Admin မှတင်သော Order များကိုလည်း Firebase orders ထဲတွင် သိမ်းဆည်းပါမည်။</div><iframe title="Create order" src="../customer/index.html" style="width:100%;height:1800px;border:0;border-radius:16px;background:transparent"></iframe></section><div id="status" class="status"></div></section><p class="muted">Admin password ကို frontend code ထဲတွင် မထည့်ထားပါ။ Server secret အဖြစ်သာ သတ်မှတ်ပါ။</p></main><script src="../shared/common.js"></script><script src="./app.js"></script></body></html>
