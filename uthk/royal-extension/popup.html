<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UTHK Royal Sync</title>
    <style>
        body { width: 300px; margin: 0; padding: 16px; color: #17243b; background: #f4f7fb; font: 14px/1.5 Arial, sans-serif; }
        h1 { margin: 0 0 9px; font-size: 17px; }
        p { margin: 0 0 13px; color: #596981; }
        button { width: 100%; min-height: 40px; border: 0; border-radius: 9px; color: white; background: #3978e8; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #status { margin-top: 12px; font-size: 12px; overflow-wrap: anywhere; }
        #status.error { color: #b42336; }
        a { display: inline-block; margin-top: 10px; color: #3978e8; }
    </style>
</head>
<body>
    <h1>UTHK · Royal auto-sync</h1>
    <p>Royal Shipment စာမျက်နှာဖွင့်ထားလျှင် တစ်မိနစ်တစ်ကြိမ် စစ်ဆေးပါမည်။</p>
    <button id="toggle-sync" type="button">Pause sync</button>
    <div id="status" role="status">အခြေအနေကို ဖတ်နေသည်…</div>
    <a href="https://member.royalx.biz/shipment" target="_blank" rel="noopener noreferrer">Royal Shipments ဖွင့်ရန်</a>
    <script src="popup.js"></script>
</body>
</html>
