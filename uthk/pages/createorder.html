<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>အမှာစာအသစ် | UTHK Admin</title>
    <link rel="icon" type="image/png" href="../logo.png"><link rel="apple-touch-icon" href="../icons/app-icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body><main class="page-shell">
    <header class="page-top"><a class="back-button" href="../index.html" aria-label="Home"><i class="fa-solid fa-arrow-left"></i></a><div><h1 class="page-title">အမှာစာအသစ်</h1><p class="page-subtitle">မှာယူသူနှင့် စာအုပ်အရေအတွက် ဖြည့်ပြီး အမှာစာနှင့် ဘောက်ချာဖန်တီးပါ။</p></div></header>
    <form id="create-order-form">
        <section class="panel"><h2>မှာယူသူအချက်အလက်</h2><div class="form-grid">
            <label class="field">အမည်<input name="name" autocomplete="name" required></label>
            <label class="field">ဖုန်းနံပါတ်<input name="phone" type="tel" inputmode="tel" autocomplete="tel" required></label>
            <label class="field full">လိပ်စာ<textarea name="address" rows="3" required></textarea></label>
            <label class="field">ငွေပေးချေမှုအမျိုးအစား
                <select name="paymentMethod" required>
                    <option value="COD">COD (ပစ္စည်းရောက်မှ ငွေချေ)</option>
                    <option value="KBZ Pay" selected>KBZ Pay</option>
                </select>
            </label>
        </div></section>
        <section class="panel"><h2>စာအုပ်နှင့် အုပ်ရေ</h2><div id="book-quantities" class="form-grid"></div><div class="receipt-total"><span>စုစုပေါင်းကျသင့်ငွေ</span><strong id="order-total">0 ကျပ်</strong></div></section>
        <section class="panel no-print"><div class="button-row"><button class="primary-button" id="submit-order" type="submit"><i class="fa-solid fa-circle-check"></i> အမှာစာ အတည်ပြုရန်</button></div><p id="order-status" class="status-message" role="status"></p></section>
    </form>
    <section id="created-receipt" class="receipt" hidden>
        <div class="receipt-head"><div class="receipt-heading"><p class="eyebrow">PHYSICS LEARNING HUB</p><h2>မှာယူမှု ဘောက်ချာ</h2><strong id="receipt-voucher"></strong></div><img class="receipt-logo" src="../logo.png" alt="UTHK logo"></div>
        <div id="receipt-content" class="receipt-grid"></div>
        <div class="receipt-total"><span>စုစုပေါင်း</span><strong id="receipt-total"></strong></div>
        <div class="button-row no-print"><button id="print-created-receipt" class="primary-button" type="button"><i class="fa-solid fa-print"></i> Print / Save PDF</button></div>
    </section>
</main>
<script src="admin-api.js"></script><script src="createorder.js"></script>
</body></html>
